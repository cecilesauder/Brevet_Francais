<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objectif Brevet : Français</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --primary: #4a90e2;
            --card-bg: #ffffff;
            --text: #333333;
            --insuffisant: #ff4d4f;
            --fragile: #ffa940;
            --satisfaisant: #73d13d;
            --tres-bon: #389e0d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .stats span {
            margin-left: 15px;
            font-weight: bold;
            font-size: 1.1em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            background-color: #e0e0e0;
            transition: background 0.3s;
        }

        button.active {
            background-color: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .tab-content.active { display: block; }

        /* Competences */
        .competence { margin-bottom: 20px; }
        .comp-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
        }
        .progress-fill {
            height: 100%;
            transition: width 0.5s, background-color 0.5s;
        }

        /* Badges */
        .badges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }
        .badge {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            background: #f0f0f0;
            opacity: 0.4;
            filter: grayscale(100%);
            transition: 0.3s;
        }
        .badge.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            background: #e6f7ff;
            border: 2px solid var(--primary);
        }
        .badge-icon { font-size: 2.5em; margin-bottom: 10px; }

        /* Exercice */
        .question-card { margin-bottom: 20px; padding: 15px; border-left: 5px solid var(--primary); background: #f9f9f9; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .option-btn { background: white; border: 2px solid var(--primary); text-align: left; }
        .option-btn:hover { background: #e6f7ff; }
        
        #feedback { font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">

            <div class="comp-header"><span>✍️ Rédaction</span><span id="lvl-redac">Niveau 1</span></div>
            <div class="progress-bar"><div id="bar-redac" class="progress-fill" style="width: 25%;"></div></div>
        </div>

        <h3>Exercice rapide</h3>

        </div>

        <h3>Tes Récompenses</h3>
        <div class="badges-grid" id="badges-container">

        </div>
    </div>
</div>

Les compétences du cycle 4 (définies par le socle commun et le BO) se divisent en quatre piliers pour l'épreuve de français :
1. **Compréhension et interprétation :** Analyser un texte littéraire et un document iconographique (repérage, inférence, interprétation).
2. **Étude de la langue :** Maîtriser la grammaire, le vocabulaire et l'orthographe (réécriture, analyse syntaxique).
3. **Rédaction :** Produire un texte articulé et cohérent (au choix : sujet d'imagination ou sujet de réflexion).
4. **Dictée :** Mobiliser les règles de l'orthographe grammaticale et lexicale.

Le code ci-dessous est une application web autonome (Single Page Application) fonctionnant avec le `localStorage` du navigateur. Elle est prête à être déployée sur une solution d'hébergement statique (comme GitHub Pages) et utilise des titres de badges épicènes pour un environnement inclusif et motivant.

        </div>

        <div class="skill-container">
            <div class="skill-header"><span>⚙️ Étude de la langue (Grammaire)</span> <span id="val-gram">0%</span></div>
            <div class="progress-bg"><div class="progress-bar" id="bar-gram"></div></div>
            <span class="status-label" id="status-gram">Maîtrise insuffisante</span>
        </div>

        <div class="skill-container">
            <div class="skill-header"><span>✍️ Rédaction</span> <span id="val-redac">0%</span></div>
            <div class="progress-bg"><div class="progress-bar" id="bar-redac"></div></div>
            <span class="status-label" id="status-redac">Maîtrise insuffisante</span>
        </div>

        <div class="skill-container">
            <div class="skill-header"><span>📝 Dictée & Orthographe</span> <span id="val-dict">0%</span></div>
            <div class="progress-bg"><div class="progress-bar" id="bar-dict"></div></div>
            <span class="status-label" id="status-dict">Maîtrise insuffisante</span>
        </div>
    </section>

        <h2>Trophées & Badges</h2>
        <div class="badges-container">
            <div class="badge" id="badge-streak">

                <div class="badge-title">Fidèle au Poste</div>
                <div style="font-size: 0.7em">3 jours de suite</div>
            </div>

                <div class="badge-icon">🕵️</div>

<script>
    // Initialisation des données
    let userData = JSON.parse(localStorage.getItem('brevetData')) || {
        skills: { comp: 0, gram: 0, redac: 0, dict: 0 },
        xp: 0,
        streak: 0,
        lastLogin: null
    };

    function init() {
        checkStreak();
        updateUI();
    }

    // Gestion de l'assiduité (Streak)
    function checkStreak() {
        const today = new Date().toDateString();
        if (userData.lastLogin !== today) {
            if (userData.lastLogin === new Date(Date.now() - 86400000).toDateString()) {
                userData.streak += 1;
            } else {
                userData.streak = 1; 
            }
            userData.lastLogin = today;
            saveData();
        }
    }

    // Évaluation officielle
    function getStatus(value) {
        if (value < 25) return "Maîtrise insuffisante";
        if (value < 50) return "Maîtrise fragile";
        if (value < 75) return "Maîtrise satisfaisante";
        return "Très bonne maîtrise";
    }

    // Mise à jour de l'interface
    function updateUI() {
        document.getElementById('streak-count').innerText = userData.streak;
        document.getElementById('xp-count').innerText = userData.xp;

        ['comp', 'gram', 'redac', 'dict'].forEach(skill => {
            const val = Math.min(userData.skills[skill], 100);
            document.getElementById(`bar-${skill}`).style.width = `${val}%`;
            document.getElementById(`val-${skill}`).innerText = `${val}%`;
            document.getElementById(`status-${skill}`).innerText = getStatus(val);
        });

        checkBadges();
    }

    // Déverrouillage des badges
    function checkBadges() {
        if (userData.streak >= 3) document.getElementById('badge-streak').classList.add('unlocked');
        if (userData.skills.comp >= 70) document.getElementById('badge-comp').classList.add('unlocked');
        if (userData.skills.gram >= 70) document.getElementById('badge-gram').classList.add('unlocked');
        if (userData.skills.redac >= 70) document.getElementById('badge-redac').classList.add('unlocked');
    }

    // Simulation d'un exercice réussi
    function simulateExercise(skill, points) {
        if (userData.skills[skill] < 100) {
            userData.skills[skill] += points;
            if (userData.skills[skill] > 100) userData.skills[skill] = 100;
            userData.xp += 50;
            saveData();
            updateUI();
        }
    }

    function saveData() {
        localStorage.setItem('brevetData', JSON.stringify(userData));
    }

    function resetData() {
        if(confirm("Voulez-vous vraiment effacer toute la progression ?")) {
            localStorage.removeItem('brevetData');
            location.reload();
        }
    }

    // Lancement
    init();
</script>
